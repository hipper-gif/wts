# ============================================================
# WTS テナント定義ファイル
# ============================================================
# フォーマット: テナントID  DB名  ベースパス  表示名
# 1行1テナント、#で始まる行はコメント、空行は無視
#
# テナントID: 英数字とハイフンのみ（ディレクトリ名に使用）
# DB名: XserverのMySQL DB名（Xserver管理パネルで事前作成が必要）
# ベースパス: URLのパス部分（APP_BASE_PATH に設定される）
# 表示名: system_settings の system_name に設定される値
# ============================================================

# 既存テナント（Smiley社）
kinki	twinklemark_wts	/Smiley/taxi/wts	福祉輸送管理システム

# LINO介護タクシー（2026-04-10 開設）
lino	twinklemark_wtslino	/wts-tenants/lino	LINO介護タクシー運行管理

# 新しいテナントを追加する場合は行を追加:
# acme	twinklemark_wts_acme	/wts-tenants/acme	テナントA社

# ------------------------------------------------------------
# 開設予定（2026-09-18 起票・会社名ヒアリング前）
# 手順: docs/tenants/README.md / 進捗: docs/tenants/_pending/checklist.md
# 会社名が決まったらテナントIDを埋めてコメントを外す。
# DB名は twinklemark_wts<テナントID>、ベースパスは /wts-tenants/<テナントID>。
# <ID>	twinklemark_wts<ID>	/wts-tenants/<ID>	<表示名>
# ------------------------------------------------------------

# 検証用（開設の通し稽古・2026-09-24。空DBから本番と同じ経路を通すため verify2 を XServer API で新規作成。本物の1社目が立ったら消してよい）
# ※ twinklemark_wtsverify（9/18の検証・テーブル入り）は保持のまま・ここには載せない
verify2	twinklemark_wtsverify2	/wts-tenants/verify2	検証用テナント（開設稽古）

# Fire Mountain Brothers 株式会社（東京都練馬区・2026-09-25 開設。facts=docs/tenants/fmb/）
fmb	twinklemark_wtsfmb	/wts-tenants/fmb	Fire Mountain Brothers 運行管理
